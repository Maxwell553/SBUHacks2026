<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PolyEngine visual harness</title>
    <style>
      body {
        margin: 0;
        background: #222;
        color: #ddd;
        font: 12px monospace;
      }
      #sheet {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px;
      }
      figure {
        margin: 0;
      }
      canvas {
        display: block;
      }
      figcaption {
        padding: 2px 0;
      }
    </style>
  </head>
  <body>
    <div id="stats">rendering…</div>
    <div id="sheet"></div>
    <!-- Cache-busted so a rebuilt bundle is always picked up. -->
    <script type="module">
      import("./dist/bundle.js?t=" + Date.now());
    </script>
  </body>
</html>
